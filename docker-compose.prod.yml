# Production override (restart policies, public ports):
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# HTTPS: VHS_HTTPS=true in .env, with the certificate in the certs folder (docs/installation.md).
# Do not edit the files of a release: ./vhs update replaces them; settings go in .env.

services:
  db:
    restart: unless-stopped

  backend:
    restart: unless-stopped

  worker:
    restart: unless-stopped

  nginx:
    restart: unless-stopped
    # 1976, the year VHS tapes came out, and 1977 for HTTPS; VHS_HTTP_PORT and VHS_HTTPS_PORT
    # in .env change them (docs/installation.md).
    ports: !override
      - "${VHS_HTTP_PORT:-1976}:80"
      - "${VHS_HTTPS_PORT:-1977}:443"
    environment:
      VHS_HTTPS: ${VHS_HTTPS:-false}
    volumes:
      - static:/srv/static:ro
      - ./certs:/etc/nginx/certs:ro
