upstream vhs_backend {
    server backend:8000;
}

server {
    listen 80;
    server_name _;

    # Request size limit for the API (cookie uploads included).
    client_max_body_size 2m;

    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    # HTTPS: in production mount the certificate and key and enable the block below.
    # listen 443 ssl;
    # ssl_certificate     /etc/nginx/certs/fullchain.pem;
    # ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # Vue SPA
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # Django API and admin
    location ~ ^/(api|admin)/ {
        proxy_pass http://vhs_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Django admin static files (collectstatic)
    location /static/ {
        alias /srv/static/;
        expires 7d;
        access_log off;
    }

    # Work area of in-progress downloads: never served, not even through a redirect.
    location ^~ /media-internal/.incomplete/ {
        internal;
        return 404;
    }

    # Protected media: reachable only through an X-Accel-Redirect issued by Django.
    location /media-internal/ {
        internal;
        alias /srv/video-library/;
        disable_symlinks on;
    }
}
