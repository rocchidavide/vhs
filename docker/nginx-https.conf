# HTTPS for VHS's Nginx (docs/installation.md): docker/nginx-https.sh copies this file into the
# server block of docker/nginx.conf when VHS_HTTPS is true. The certificate and its key come
# from the certs folder of the installation (docker-compose.prod.yml).
listen 443 ssl;
ssl_certificate     /etc/nginx/certs/fullchain.pem;
ssl_certificate_key /etc/nginx/certs/privkey.pem;
