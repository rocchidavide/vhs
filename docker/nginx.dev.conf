# Development proxy (docker-compose.dev.yml). Django (runserver) and Vite run in their own
# containers and are reached by service name, the same on macOS and Linux. The production
# config is docker/nginx.conf.
#
# proxy_pass uses variables so that Docker's DNS is asked at request time: a recreated
# container gets a new address, and a static upstream would keep the old one.
resolver 127.0.0.11 valid=10s ipv6=off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 2m;

    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    # Django API, admin and admin static files (served by runserver in development).
    location ~ ^/(api|admin|static)/ {
        set $django http://backend:8000;
        proxy_pass $django;
        # $http_host keeps the port, so Django sees the same origin as the browser.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Vite dev server, including the HMR WebSocket.
    location / {
        set $vite http://frontend:5173;
        proxy_pass $vite;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
    }

    # Work area of in-progress downloads: never served, not even through a redirect.
    location ^~ /media-internal/.incomplete/ {
        internal;
        return 404;
    }

    # Protected media: reachable only through an X-Accel-Redirect issued by Django.
    location /media-internal/ {
        internal;
        alias /srv/video-library/;
        disable_symlinks on;
    }
}
